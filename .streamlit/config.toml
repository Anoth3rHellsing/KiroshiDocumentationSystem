[theme]
base = "light"
primaryColor = "#adadad"
secondaryBackgroundColor = "#dc5d81"
textColor = "#000000"

[server]
# Packaged builds disable CORS so the app can be embedded locally; disable XSRF
# too so Streamlit doesn't override the CORS flag during startup.
enableCORS = false
enableXsrfProtection = false
