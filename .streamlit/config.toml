[theme]
primaryColor = "#d01e4e"
backgroundColor = "#d01e4e"
secondaryBackgroundColor = "#b3b3b3"
textColor = "#ffffff"

[server]
# Packaged builds disable CORS so the app can be embedded locally; disable XSRF
# too so Streamlit doesn't override the CORS flag during startup.
enableCORS = false
enableXsrfProtection = false
