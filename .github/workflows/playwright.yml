name: Playwright visual regression

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start Streamlit server
        run: |
          streamlit run case_documentation_app.py --server.headless true --server.port 8501 > streamlit.log 2>&1 &
          for i in {1..40}; do
            if curl -sSf http://127.0.0.1:8501 >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          echo "Streamlit server failed to start" >&2
          cat streamlit.log >&2 || true
          exit 1

      - name: Run Playwright tests
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8501
        run: npm run test:e2e

